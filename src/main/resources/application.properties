# Configuration is read from environment variables.
# For local development, copy .env.example to .env and fill in your values;
# the optional import below loads it automatically.
spring.config.import=optional:file:.env[.properties]

## Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

server.servlet.context-path=/api
server.port=${SERVER_PORT:8081}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# create-drop rebuilds the schema on every start (demo data is re-seeded by the "testdata" profile).
# Use "validate" or a migration tool before running this against persistent data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false

# Verbose Spring auto-configuration report; off unless explicitly enabled.
debug=${DEBUG:false}

# Base64-encoded HMAC key (at least 256 bits). Generate one with: openssl rand -base64 32
token.signing.key=${JWT_SIGNING_KEY}
