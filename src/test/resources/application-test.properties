# Used by tests annotated with @ActiveProfiles("test"): in-memory H2 instead of PostgreSQL.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:spine;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Dummy key for tests only (base64 of 32 zero-bytes-like ASCII); not used anywhere else.
token.signing.key=dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC1hLXNlY3JldC0wMTIzNDU2Nzg5
